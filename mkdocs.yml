site_name: Kubernetes AI Operator & Workflow Runtime
site_description: Documentation portal for Kubernetes AI Operator, Graph State Machines, Embabel, MCP, and Telemetry.
site_author: Tuluat AI Team
site_url: https://netologist.github.io/tuluat/
repo_name: netologist/tuluat
repo_url: https://github.com/netologist/tuluat
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Palette toggle for light mode (Default)
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid.js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - admonition

nav:
  - Home: index.md
  - Features:
      - LLM Providers: features/llm-providers.md
      - Agents & Skills: features/agents-and-skills.md
      - Workflows & Sessions: features/workflows-and-sessions.md
      - Safety Guardrails: features/guardrails.md
      - MCP & A2A Protocols: features/mcp-and-a2a.md
      - RAG & Memory: features/rag-and-memory.md
  - Architecture:
      - Overview: architecture/overview.md
      - Low-Level Design: architecture/low-level-design.md
      - Safety & Guardrails: architecture/safety-and-guardrails.md
      - HITL Approval System: architecture/hitl-approval-system.md
      - RAG System: architecture/rag-system.md
  - CRDs:
      - Specification & Manifests: crds/overview.md
  - Modules:
      - Overview & Reactor Layers: modules/overview.md
      - Maven Dependencies: modules/dependencies.md
  - Tests:
      - Testing & Quality Guide: tests/testing-guide.md
  - Dev Environment:
      - Local Setup & Port-Forwarding: dev-environment/setup.md
  - ADRs:
      - "ADR 001: Durable Execution Engine": adrs/001-durable-execution-engine.md
      - "ADR 002: Embabel Agent Framework": adrs/002-embabel-agent-framework.md
      - "ADR 003: MCP & A2A Protocols": adrs/003-mcp-and-a2a-protocols.md
      - "ADR 004: Guardrails & Verification": adrs/004-guardrails-and-verification.md
      - "ADR 005: Visual Builder & HITL GUI": adrs/005-visual-builder-and-hitl-gui.md
      - "ADR 006: Multi-Module Architecture and Tuluat Rebranding": adrs/006-multi-module-architecture-and-tuluat-rebranding.md
      - "ADR 007: Skill Provisioning vs Binding, Model Gateway": adrs/007-skill-provisioning-model-gateway-evre2-placement.md
      - "ADR 008: Retrieval-Augmented Generation (RAG) System": adrs/008-rag-system.md
      - "ADR 009: Agent Harness — Sandboxed Execution Runtime": adrs/009-agent-harness.md
      - "ADR 010: GraalVM Native Image Transition": adrs/010-graalvm-native-image-tech-debt.md
      - "ADR 011: Optional<T> Constructor Injection": adrs/011-optional-constructor-injection.md

validation:
  nav:
    omitted_files: warn
    absolute_links: warn
    not_found: warn
