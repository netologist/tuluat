apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: k8s-ai-operator-telemetry
  namespace: tuluat-system
  labels:
    app: k8s-crd-ai-operator
spec:
  selector:
    matchLabels:
      app: tuluat-operator
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
