apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-ai-operator-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-ai-operator-role
rules:
  - apiGroups: ["ai.tuluat.com"]
    resources: ["llmproviders", "llmproviders/status", "aiagents", "aiagents/status"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["services", "secrets", "configmaps", "pods", "events"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-ai-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-ai-operator-role
subjects:
  - kind: ServiceAccount
    name: k8s-ai-operator-sa
    namespace: default
