apiVersion: v1
kind: ServiceAccount
metadata:
  name: tuluat-operator-sa
  namespace: tuluat-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tuluat-operator-role
rules:
  - apiGroups: ["ai.tuluat.com"]
    resources:
      - llmproviders
      - llmproviders/status
      - aiagents
      - aiagents/status
      - aiworkflows
      - aiworkflows/status
      - workflowsessions
      - workflowsessions/status
      - mcpservers
      - mcpservers/status
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["services", "secrets", "configmaps", "pods", "events"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tuluat-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tuluat-operator-role
subjects:
  - kind: ServiceAccount
    name: tuluat-operator-sa
    namespace: tuluat-system
