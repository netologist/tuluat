apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-ai-operator
  namespace: default
  labels:
    app: k8s-ai-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-ai-operator
  template:
    metadata:
      labels:
        app: k8s-ai-operator
    spec:
      serviceAccountName: k8s-ai-operator-sa
      containers:
        - name: operator
          image: k8s-crd-ai-operator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_THREADS_VIRTUAL_ENABLED
              value: "true"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
