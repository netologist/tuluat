apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuluat-operator
  namespace: tuluat-system
  labels:
    app: tuluat-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tuluat-operator
  template:
    metadata:
      labels:
        app: tuluat-operator
    spec:
      serviceAccountName: tuluat-operator-sa
      containers:
        - name: operator
          image: tuluat-operator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_THREADS_VIRTUAL_ENABLED
              value: "true"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
