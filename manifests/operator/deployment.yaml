apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuluat-operator
  namespace: tuluat-system
  labels:
    app: tuluat-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tuluat-operator
  template:
    metadata:
      labels:
        app: tuluat-operator
    spec:
      serviceAccountName: tuluat-operator-sa
      containers:
        - name: operator
          image: tuluat-operator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_THREADS_VIRTUAL_ENABLED
              value: "true"
            - name: SPRING_AI_OPENAI_BASE_URL
              value: "http://wiremock-service.tuluat-system.svc.cluster.local:8080/v1"
            - name: TULUAT_RAG_STORAGE_TYPE
              value: "s3"
            - name: TULUAT_RAG_STORAGE_S3_ENDPOINT
              value: "http://minio-service.tuluat-system.svc.cluster.local:9000"
            - name: TULUAT_RAG_STORAGE_S3_BUCKET
              value: "rag-documents"
            - name: TULUAT_RAG_STORAGE_S3_ACCESS_KEY
              value: "minioadmin"
            - name: TULUAT_RAG_STORAGE_S3_SECRET_KEY
              value: "minioadmin"
            - name: TULUAT_RAG_RETRIEVER
              value: "pgvector"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
