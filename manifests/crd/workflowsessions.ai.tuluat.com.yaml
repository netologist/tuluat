apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workflowsessions.ai.tuluat.com
spec:
  group: ai.tuluat.com
  names:
    kind: WorkflowSession
    listKind: WorkflowSessionList
    plural: workflowsessions
    singular: workflowsession
    shortNames:
      - wfsession
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                workflowRef:
                  type: string
                input:
                  type: string
                parameters:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                sessionId:
                  type: string
                phase:
                  type: string
                currentNode:
                  type: string
                output:
                  type: string
                startTime:
                  type: string
                endTime:
                  type: string
                totalTokens:
                  type: integer
                  format: int64
                inputTokens:
                  type: integer
                  format: int64
                outputTokens:
                  type: integer
                  format: int64
                costUsd:
                  type: number
                durationSeconds:
                  type: integer
                nodeExecutions:
                  type: array
                  items:
                    type: object
                    properties:
                      nodeId:
                        type: string
                      agentName:
                        type: string
                      provider:
                        type: string
                      model:
                        type: string
                      input:
                        type: string
                      output:
                        type: string
                      startTime:
                        type: string
                      endTime:
                        type: string
                      durationMs:
                        type: integer
                        format: int64
                      totalTokens:
                        type: integer
                        format: int64
                      inputTokens:
                        type: integer
                        format: int64
                      outputTokens:
                        type: integer
                        format: int64
                      costUsd:
                        type: number
                      status:
                        type: string
      additionalPrinterColumns:
        - name: sessionId
          type: string
          description: Session ID
          jsonPath: .status.sessionId
        - name: phase
          type: string
          description: Session phase
          jsonPath: .status.phase
        - name: startTime
          type: string
          description: Start time
          jsonPath: .status.startTime
        - name: endTime
          type: string
          description: End time
          jsonPath: .status.endTime
        - name: totalTokens
          type: integer
          description: Total tokens used
          jsonPath: .status.totalTokens
        - name: inputTokens
          type: integer
          description: Input tokens
          jsonPath: .status.inputTokens
        - name: outputTokens
          type: integer
          description: Output tokens
          jsonPath: .status.outputTokens
        - name: cost
          type: number
          description: Cost in USD
          jsonPath: .status.costUsd
