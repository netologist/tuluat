apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workflowsessions.ai.tuluat.com
spec:
  group: ai.tuluat.com
  names:
    kind: WorkflowSession
    listKind: WorkflowSessionList
    plural: workflowsessions
    singular: workflowsession
    shortNames:
      - wfsession
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                workflowRef:
                  type: string
                input:
                  type: string
                parameters:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                sessionId:
                  type: string
                phase:
                  type: string
                currentNode:
                  type: string
                output:
                  type: string
                startTime:
                  type: string
                endTime:
                  type: string
