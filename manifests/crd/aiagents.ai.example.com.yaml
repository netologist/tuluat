apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aiagents.ai.example.com
spec:
  group: ai.example.com
  names:
    kind: AiAgent
    listKind: AiAgentList
    plural: aiagents
    singular: aiagent
    shortNames:
      - agent
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                providerRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                model:
                  type: string
                  description: "Model override for this agent"
                systemPrompt:
                  type: string
                  description: "System instructions for the AI model"
                userPrompt:
                  type: string
                  description: "Default user query / prompt template"
                skills:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                      enabled:
                        type: boolean
                      parameters:
                        type: object
                        additionalProperties:
                          type: string
                ingress:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    host:
                      type: string
                    path:
                      type: string
                    pathType:
                      type: string
                    ingressClassName:
                      type: string
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                    tls:
                      type: object
                      properties:
                        secretName:
                          type: string
                        hosts:
                          type: array
                          items:
                            type: string
                replicas:
                  type: integer
            status:
              type: object
              properties:
                phase:
                  type: string
                ingressUrl:
                  type: string
                activeSkills:
                  type: array
                  items:
                    type: string
                effectiveModel:
                  type: string
                message:
                  type: string
                observedGeneration:
                  type: integer
                lastReconciledAt:
                  type: string
