apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aiworkflows.ai.tuluat.com
spec:
  group: ai.tuluat.com
  names:
    kind: AiWorkflow
    listKind: AiWorkflowList
    plural: aiworkflows
    singular: aiworkflow
    shortNames:
      - workflow
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                description:
                  type: string
                initialNode:
                  type: string
                nodes:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      agentRef:
                        type: string
                      inputTemplate:
                        type: string
                      outputKey:
                        type: string
                      expression:
                        type: string
                edges:
                  type: array
                  items:
                    type: object
                    properties:
                      from:
                        type: string
                      to:
                        type: string
                      condition:
                        type: string
                memoryConfig:
                  type: object
                  properties:
                    shortMemorySize:
                      type: integer
                    enableLongMemory:
                      type: boolean
                    vectorTableName:
                      type: string
            status:
              type: object
              properties:
                state:
                  type: string
                nodeCount:
                  type: integer
