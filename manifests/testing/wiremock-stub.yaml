apiVersion: v1
kind: ConfigMap
metadata:
  name: wiremock-stubs
  namespace: tuluat-system
data:
  openai-chat-completion.json: |
    {
      "priority": 10,
      "request": {
        "method": "POST",
        "urlPathPattern": ".*chat/completions"
      },
      "response": {
        "status": 200,
        "headers": {
          "Content-Type": "application/json"
        },
        "jsonBody": {
          "id": "chatcmpl-wiremock-stub-001",
          "object": "chat.completion",
          "created": 1700000000,
          "model": "wiremock-gpt-4o",
          "choices": [
            {
              "index": 0,
              "message": {
                "role": "assistant",
                "content": "{\"summary\": \"WireMock stub LLM response: HIGH risk detected, payment SUCCESS.\", \"riskLevel\": \"HIGH\", \"paymentStatus\": \"SUCCESS\", \"riskScore\": 0.95}"
              },
              "finish_reason": "stop"
            }
          ],
          "usage": {
            "prompt_tokens": 20,
            "completion_tokens": 15,
            "total_tokens": 35
          }
        }
      }
    }

  rag-chat-completion.json: |
    {
      "priority": 1,
      "request": {
        "method": "POST",
        "urlPathPattern": ".*chat/completions",
        "bodyPatterns": [
          { "contains": "Relevant Document Context (RAG):" }
        ]
      },
      "response": {
        "status": 200,
        "headers": {
          "Content-Type": "application/json"
        },
        "jsonBody": {
          "id": "chatcmpl-rag-stub-001",
          "object": "chat.completion",
          "created": 1700000000,
          "model": "wiremock-gpt-4o",
          "choices": [
            {
              "index": 0,
              "message": {
                "role": "assistant",
                "content": "{\"summary\": \"RAG retrieval verified: document context injected into system prompt.\", \"ragRetrieved\": true}"
              },
              "finish_reason": "stop"
            }
          ],
          "usage": {
            "prompt_tokens": 20,
            "completion_tokens": 15,
            "total_tokens": 35
          }
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiremock-stub
  namespace: tuluat-system
  labels:
    app: wiremock-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wiremock-stub
  template:
    metadata:
      labels:
        app: wiremock-stub
    spec:
      containers:
        - name: wiremock
          image: wiremock/wiremock:3.9.1
          args:
            - "--verbose"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: stub-mappings
              mountPath: /home/wiremock/mappings
      volumes:
        - name: stub-mappings
          configMap:
            name: wiremock-stubs
---
apiVersion: v1
kind: Service
metadata:
  name: wiremock-service
  namespace: tuluat-system
  labels:
    app: wiremock-stub
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: wiremock-stub
