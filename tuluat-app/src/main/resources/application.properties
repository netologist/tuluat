# Virtual Threads Enablement
spring.threads.virtual.enabled=true

# Server Configuration
server.port=8080
spring.application.name=tuluat-operator-app

# Actuator & Prometheus Telemetry Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=k8s-crd-ai-operator
management.endpoint.health.show-details=always

# DataSource & JPA Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-service:5432/ai_operator_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.packagesToScan=com.tuluat.engine.entity
spring.jpa.show-sql=false
# Logging Configuration
logging.level.root=INFO
logging.level.com.tuluat=DEBUG
logging.level.io.javaoperatorsdk=INFO
logging.level.io.fabric8.kubernetes=WARN

# JOSDK Spring Boot Configuration
javaoperatorsdk.reconcilers.llmprovider-reconciler.namespaces=
javaoperatorsdk.reconcilers.aiagent-reconciler.namespaces=
javaoperatorsdk.reconcilers.aiworkflowreconciler.namespaces=
javaoperatorsdk.reconcilers.workflowsessionreconciler.namespaces=

# Spring AI Connection Properties
spring.ai.openai.api-key=sk-dummy-operator-runtime-key
spring.ai.openai.base-url=https://api.deepseek.com

# ── Embabel Agent Platform ───────────────────────────────────────────────
# Static fallback: used only when no LlmProvider CRDs exist.
# At runtime, LlmProvider CRDs override these values.

embabel.agent.platform.models.openai.custom.api-key=${OPENAI_CUSTOM_API_KEY:sk-dummy-operator-runtime-key}
embabel.agent.platform.models.openai.custom.base-url=${OPENAI_CUSTOM_BASE_URL:https://api.deepseek.com}
embabel.agent.platform.models.openai.custom.models=${OPENAI_CUSTOM_MODELS:deepseek-chat}

# Default LLM (overridable via env)
embabel.models.default-llm=${EMBABEL_MODELS_DEFAULT_LLM:deepseek-chat}
