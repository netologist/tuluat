apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tuluat-system

# E2E overlay: only deploys WireMock-backed resources.
# No real LLM API keys are needed — all agent calls go through
# wiremock-service which returns stub responses.

resources:
  # WireMock stub server is applied directly in step 3 of deploy-operator.sh
  # (manifests/testing/wiremock-stub.yaml) — not referenced here because kustomize
  # 5+ blocks paths that escape the kustomization root (../../ is forbidden).

  # PostgreSQL + pgvector (operator DataSource: postgres-service:5432)
  - samples/00_postgres_pgvector.yaml

  # WireMock-backed LlmProvider (no real API key needed)
  - samples/03_llmprovider_wiremock.yaml

  # Sample AiAgents (reference wiremock-provider)
  - samples/04_web_researcher_agent.yaml
  - samples/04_report_writer_agent.yaml
  # Financial Analyst Agent (financial data E2E scenario)
  - samples/financial_analyst_agent.yaml


  # Sample AiWorkflow
  - samples/05_aiworkflow_sample.yaml

secretGenerator:
  - name: openai-secret
    namespace: tuluat-system
    literals:
      - api-key=sk-e2e-wiremock-placeholder

generatorOptions:
  disableNameSuffixHash: true
