apiVersion: ai.tuluat.com/v1alpha1
kind: LlmProvider
metadata:
  name: openai-provider
  namespace: tuluat-system
spec:
  # Embabel GOAP engine discovers models from LlmProvider CRDs at startup.
  # apiKeySecretRef → resolved from Kubernetes Secret → injected into ChatModel.
  providerType: "OPENAI"
  baseUrl: "https://api.openai.com/v1"
  apiKeySecretRef:
    name: "openai-secret"
    key: "api-key"
  defaultModel: "gpt-4o"
  temperature: 0.7
  maxTokens: 2048
  costPer1kInputTokens: 0.0025
  costPer1kOutputTokens: 0.0100
  fallbacks:
    - providerName: "deepseek-provider"
      namespace: "tuluat-system"
      model: "deepseek-chat"
