apiVersion: ai.tuluat.com/v1alpha1
kind: LlmProvider
metadata:
  name: deepseek-provider
  namespace: tuluat-system
spec:
  providerType: "DEEPSEEK"
  baseUrl: "https://api.deepseek.com"
  apiKeySecretRef:
    name: "deepseek-secret"
    key: "api-key"
  defaultModel: "deepseek-chat" # DeepSeek-V3 or deepseek-reasoner (DeepSeek-R1)
  temperature: 0.7
  maxTokens: 4096
