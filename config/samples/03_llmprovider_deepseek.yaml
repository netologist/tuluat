apiVersion: ai.tuluat.com/v1alpha1
kind: LlmProvider
metadata:
  name: deepseek-provider
  namespace: tuluat-system
spec:
  # DeepSeek uses the OpenAI-compatible API → providerType: OPENAI
  providerType: "OPENAI"
  baseUrl: "https://api.deepseek.com"
  apiKeySecretRef:
    name: "deepseek-secret"
    key: "api-key"
  defaultModel: "deepseek-chat" # DeepSeek-V3; also available: deepseek-reasoner (R1)
  temperature: 0.7
  maxTokens: 4096
  costPer1kInputTokens: 0.00014
  costPer1kOutputTokens: 0.00028
  fallbacks:
    - providerName: "ollama-provider"
      namespace: "tuluat-system"
      model: "llama3.2"
