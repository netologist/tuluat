apiVersion: ai.tuluat.com/v1alpha1
kind: AiAgent
metadata:
  name: customer-support-agent
  namespace: tuluat-system
spec:
  providerRef:
    name: "deepseek-provider"
    namespace: "tuluat-system"
  model: "deepseek-chat"
  systemPrompt: |
    You are an expert enterprise customer support AI assistant.
    Always be concise, accurate, polite, and execute relevant tools when required.
  userPrompt: "Calculate 150 * 4 and check weather in Istanbul."
  skills:
    - name: "k8s-operator-guide"
      description: "Kubernetes Operator development and status guidelines"
      enabled: true
  skillSources:
    - type: "FOLDER"
      path: "/opt/tuluat/skills"
      watch: true
  tools:
    - name: "calculator"
      description: "Perform math calculations"
      enabled: true
    - name: "web-search"
      description: "Search web for real-time information"
      enabled: true
    - name: "weather"
      description: "Fetch weather data"
      enabled: true
    - name: "custom-db-skill"
      description: "Query internal customer database"
      enabled: true
      parameters:
        table: "customers"
        limit: "10"
  toolSources:
    - type: "FOLDER"
      path: "/opt/tuluat/tools"
      watch: true
  mcpServers:
    - name: "postgres-mcp"
      namespace: "tuluat-system"
  guardrails:
    piiMasking:
      enabled: true
      modes: ["EMAIL", "CREDIT_CARD", "SSN", "PHONE"]
      replacementToken: "[REDACTED]"
    promptInjection:
      enabled: true
      strategy: "BLOCK"
    outputValidation:
      enabled: true
      minConfidence: 0.6
  a2a:
    enabled: false
  ingress:
    enabled: true
    host: "ai-agent.tuluat.com"
    path: "/"
    pathType: "Prefix"
    ingressClassName: "nginx"
    annotations:
      kubernetes.io/ingress.class: "nginx"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
  replicas: 1
