apiVersion: ai.tuluat.com/v1alpha1
kind: LlmProvider
metadata:
  name: ollama-provider
  namespace: tuluat-system
spec:
  # Local Ollama instance — no apiKeySecretRef needed.
  providerType: "OLLAMA"
  baseUrl: "http://ollama-service.tuluat-system.svc.cluster.local:11434"
  defaultModel: "llama3.2"
  temperature: 0.5
  maxTokens: 1024
  costPer1kInputTokens: 0.0
  costPer1kOutputTokens: 0.0
  fallbacks: []
