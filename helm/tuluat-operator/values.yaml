# ⚠️ Proof of Concept — not production-ready
# Default values for tuluat-operator Helm chart.

# --- Operator ---
operator:
  replicaCount: 1
  image:
    repository: tuluat-operator
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    nodePort: 30080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probe:
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 3
      failureThreshold: 20
  env:
    springThreadsVirtualEnabled: "true"

# --- Namespace ---
namespace:
  name: tuluat-system
  create: false

# --- RBAC ---
serviceAccount:
  name: tuluat-operator-sa
  create: true

rbac:
  create: true

# --- CRDs ---
crds:
  install: true

# --- Ingress ---
ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: ""

# --- Infrastructure (PoC: bundled, no HA) ---
postgresql:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg16
  storage:
    size: 1Gi
  credentials:
    database: ai_operator_db
    user: postgres
    password: postgres

temporal:
  enabled: true
  image:
    repository: temporalio/auto-setup
    tag: "1.23.0"
  ui:
    enabled: true
    image:
      repository: temporalio/ui
      tag: "2.27.0"

prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v2.50.0
  retention: 7d
  serviceMonitor:
    enabled: true

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "10.3.1"
  credentials:
    user: admin
    password: admin

# --- RAG Configuration ---
rag:
  retriever: memory   # "memory" (default) or "pgvector"
  embeddingDimension: 1536
  chunkSize: 1000
  overlap: 200
  storage:
    type: local       # "local" or "s3"
    s3:
      endpoint: ""
      accessKey: ""
      secretKey: ""
      bucket: ""

# --- External LLM Providers ---
llmProviders:
  openai:
    enabled: false
    apiKey: ""
    baseUrl: https://api.openai.com/v1
    defaultModel: gpt-4o
  deepseek:
    enabled: false
    apiKey: ""
    baseUrl: https://api.deepseek.com/v1
    defaultModel: deepseek-chat
  ollama:
    enabled: false
    baseUrl: http://ollama-service:11434
    defaultModel: llama3

# --- WireMock (E2E testing stub) ---
wiremock:
  enabled: false
  image:
    repository: wiremock/wiremock
    tag: "3.9.1"
