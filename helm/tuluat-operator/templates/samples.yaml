{{/*
  E2E sample CRs — LlmProvider (wiremock), AiAgent (researcher + writer),
  AiWorkflow (multi-agent-researcher), Secret (placeholder api-keys).

  The LlmProvider is discovered by Embabel's CrdEmbabelConfiguration at
  startup and registered as an OpenAI ChatModel bean. apiKeySecretRef
  points to the Secret below, resolved via Kubernetes API.

  Enabled only when .Values.samples.install == true (default: false).
{{- if .Values.samples.install }}
---
apiVersion: v1
kind: Secret
metadata:
  name: openai-secret
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "tuluat-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.samples.apiKeys.openai | default "sk-placeholder-openai-key" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: deepseek-secret
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "tuluat-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.samples.apiKeys.deepseek | default "sk-placeholder-deepseek-key" | quote }}
---
apiVersion: ai.tuluat.com/v1alpha1
kind: LlmProvider
metadata:
  name: wiremock-provider
  namespace: {{ .Values.namespace.name }}
spec:
  providerType: "OPENAI"
  baseUrl: "http://wiremock-service.{{ .Values.namespace.name }}.svc.cluster.local:8080/v1"
  apiKeySecretRef:
    name: "openai-secret"
    key: "api-key"
  defaultModel: "wiremock-gpt-4o"
  temperature: 0.7
  maxTokens: 2048
  costPer1kInputTokens: 0.0
  costPer1kOutputTokens: 0.0
---
apiVersion: ai.tuluat.com/v1alpha1
kind: AiAgent
metadata:
  name: web-researcher-agent
  namespace: {{ .Values.namespace.name }}
spec:
  providerRef:
    name: "wiremock-provider"
    namespace: {{ .Values.namespace.name | quote }}
  model: "wiremock-gpt-4o"
  systemPrompt: |
    You are an expert AI Researcher Agent.
    Your job is to perform deep technical research on assigned topics and return structured findings.
  userPrompt: "Research Kubernetes CRD Operator patterns."
  skills:
    - name: "web-search"
      description: "Search web for real-time information"
      enabled: true
  guardrails:
    piiMasking:
      enabled: true
      modes: ["EMAIL", "CREDIT_CARD", "SSN", "PHONE"]
      replacementToken: "[REDACTED]"
    promptInjection:
      enabled: true
      strategy: "BLOCK"
    outputValidation:
      enabled: true
      minConfidence: 0.5
  a2a:
    enabled: false
  replicas: 1
---
apiVersion: ai.tuluat.com/v1alpha1
kind: AiAgent
metadata:
  name: report-writer-agent
  namespace: {{ .Values.namespace.name }}
spec:
  providerRef:
    name: "wiremock-provider"
    namespace: {{ .Values.namespace.name | quote }}
  model: "wiremock-gpt-4o"
  systemPrompt: |
    You are an expert Executive Report Writer AI Agent.
    Your job is to take raw research data and format it into a professional markdown report.
  userPrompt: "Format the research output into an executive summary."
  skills:
    - name: "calculator"
      description: "Perform calculations if metrics are needed"
      enabled: true
  guardrails:
    piiMasking:
      enabled: true
      modes: ["EMAIL", "CREDIT_CARD", "SSN", "PHONE"]
      replacementToken: "[REDACTED]"
    promptInjection:
      enabled: true
      strategy: "BLOCK"
    outputValidation:
      enabled: true
      minConfidence: 0.7
  a2a:
    enabled: false
  replicas: 1
---
apiVersion: ai.tuluat.com/v1alpha1
kind: AiWorkflow
metadata:
  name: multi-agent-researcher
  namespace: {{ .Values.namespace.name }}
spec:
  description: "Research and Report Multi-Agent Workflow (Researcher -> Evaluator -> Writer)"
  initialNode: "researcher-node"
  nodes:
    - id: "researcher-node"
      type: "AGENT"
      agentRef: "web-researcher-agent"
      inputTemplate: "Research the following topic: {{`{{input}}`}}"
      outputKey: "research_data"
    - id: "evaluator-node"
      type: "CONDITION"
      expression: "#data['research_data'] != null"
    - id: "writer-node"
      type: "AGENT"
      agentRef: "report-writer-agent"
      inputTemplate: "Analyze the following research findings and produce a final executive report:\n\n{{`{{research_data}}`}}"
      outputKey: "final_report"
  edges:
    - from: "researcher-node"
      to: "evaluator-node"
    - from: "evaluator-node"
      to: "writer-node"
      condition: "true"
  memoryConfig:
    shortMemorySize: 20
    enableLongMemory: true
    vectorTableName: "session_long_memory"
{{- end }}
