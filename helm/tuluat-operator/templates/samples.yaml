{{/*
  E2E sample CRs — LlmProvider (wiremock), AiAgent (researcher + writer),
  AiWorkflow (multi-agent-researcher), Secret (placeholder api-keys).

  The LlmProvider is discovered by Embabel's CrdEmbabelConfiguration at
  startup and registered as an OpenAI ChatModel bean. apiKeySecretRef
  points to the Secret below, resolved via Kubernetes API.

  Enabled only when .Values.samples.install == true (default: false).
*/}}
{{- if .Values.samples.install }}
---
apiVersion: v1
kind: Secret
metadata:
  name: openai-secret
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "tuluat-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.samples.apiKeys.openai | default "sk-placeholder-openai-key" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: deepseek-secret
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "tuluat-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.samples.apiKeys.deepseek | default "sk-placeholder-deepseek-key" | quote }}
---
apiVersion: ai.tuluat.com/v1alpha1
kind: LlmProvider
metadata:
  name: wiremock-provider
  namespace: {{ .Values.namespace.name }}
spec:
  providerType: "OPENAI"
  baseUrl: "http://wiremock-service.{{ .Values.namespace.name }}.svc.cluster.local:8080/v1"
  apiKeySecretRef:
    name: "openai-secret"
    key: "api-key"
  defaultModel: "wiremock-gpt-4o"
  temperature: 0.7
  maxTokens: 2048
  costPer1kInputTokens: 0.0
  costPer1kOutputTokens: 0.0
---
apiVersion: ai.tuluat.com/v1alpha1
kind: AiAgent
metadata:
  name: web-researcher-agent
  namespace: {{ .Values.namespace.name }}
spec:
  providerRef:
    name: "wiremock-provider"
    namespace: {{ .Values.namespace.name | quote }}
  model: "wiremock-gpt-4o"
  systemPrompt: |
    You are an expert AI Researcher Agent.
    Your job is to perform deep technical research on assigned topics and return structured findings.
  userPrompt: "Research Kubernetes CRD Operator patterns."
  skills:
    - name: "k8s-operator-guide"
      description: "Kubernetes Operator guidelines"
      enabled: true
  skillSources:
    - type: "FOLDER"
      path: "/opt/tuluat/skills"
      watch: true
  tools:
    - name: "web-search"
      description: "Search web for real-time information"
      enabled: true
  toolSources:
    - type: "FOLDER"
      path: "/opt/tuluat/tools"
      watch: true
  guardrails:
    piiMasking:
      enabled: true
      modes: ["EMAIL", "CREDIT_CARD", "SSN", "PHONE"]
      replacementToken: "[REDACTED]"
    promptInjection:
      enabled: true
      strategy: "BLOCK"
    outputValidation:
      enabled: true
      minConfidence: 0.5
  a2a:
    enabled: false
  replicas: 1
---
apiVersion: ai.tuluat.com/v1alpha1
kind: AiAgent
metadata:
  name: report-writer-agent
  namespace: {{ .Values.namespace.name }}
spec:
  providerRef:
    name: "wiremock-provider"
    namespace: {{ .Values.namespace.name | quote }}
  model: "wiremock-gpt-4o"
  systemPrompt: |
    You are an expert Executive Report Writer AI Agent.
    Your job is to take raw research data and format it into a professional markdown report.
  userPrompt: "Format the research output into an executive summary."
  skills:
    - name: "k8s-operator-guide"
      description: "Kubernetes Operator guidelines"
      enabled: true
  skillSources:
    - type: "FOLDER"
      path: "/opt/tuluat/skills"
      watch: true
  tools:
    - name: "calculator"
      description: "Perform calculations if metrics are needed"
      enabled: true
  toolSources:
    - type: "FOLDER"
      path: "/opt/tuluat/tools"
      watch: true
  guardrails:
    piiMasking:
      enabled: true
      modes: ["EMAIL", "CREDIT_CARD", "SSN", "PHONE"]
      replacementToken: "[REDACTED]"
    promptInjection:
      enabled: true
      strategy: "BLOCK"
    outputValidation:
      enabled: true
      minConfidence: 0.7
  a2a:
    enabled: false
  replicas: 1
---
apiVersion: ai.tuluat.com/v1alpha1
kind: AiWorkflow
metadata:
  name: multi-agent-researcher
  namespace: {{ .Values.namespace.name }}
spec:
  description: "Research and Report Multi-Agent Workflow (Researcher -> Evaluator -> Writer)"
  initialNode: "researcher-node"
  nodes:
    - id: "researcher-node"
      type: "AGENT"
      agentRef: "web-researcher-agent"
      inputTemplate: "Research the following topic: {{`{{input}}`}}"
      outputKey: "research_data"
    - id: "evaluator-node"
      type: "CONDITION"
      expression: "#data['research_data'] != null"
    - id: "writer-node"
      type: "AGENT"
      agentRef: "report-writer-agent"
      inputTemplate: "Analyze the following research findings and produce a final executive report:\n\n{{`{{research_data}}`}}"
      outputKey: "final_report"
  edges:
    - from: "researcher-node"
      to: "evaluator-node"
    - from: "evaluator-node"
      to: "writer-node"
      condition: "true"
  memoryConfig:
    shortMemorySize: 20
    enableLongMemory: true
    vectorTableName: "session_long_memory"
---
apiVersion: ai.tuluat.com/v1alpha1
kind: AiAgent
metadata:
  name: financial-analyst-agent
  namespace: {{ .Values.namespace.name }}
spec:
  providerRef:
    name: "wiremock-provider"
    namespace: {{ .Values.namespace.name | quote }}
  model: "wiremock-gpt-4o"
  systemPrompt: |
    You are a senior Financial Analyst AI Agent specializing in corporate earnings analysis,
    balance sheet review, and market performance evaluation.

    When responding to queries:
    1. Always cite the specific financial data from the provided document context.
    2. Include the source document reference for every data point.
    3. Compare multi-period data where available (YoY, QoQ).
    4. Highlight notable trends, anomalies, or risk factors.
    5. Structure answers as: Summary → Key Metrics (with sources) → Analysis → Risk Factors.
  userPrompt: "Analyze the provided financial documents and answer the user's query."
  skills:
    - name: "financial-analysis-guide"
      description: "Financial analysis methodology and reporting standards"
      enabled: true
  skillSources:
    - type: "FOLDER"
      path: "/opt/tuluat/skills"
      watch: true
  tools:
    - name: "calculator"
      description: "Perform financial calculations and ratio analysis"
      enabled: true
  toolSources:
    - type: "FOLDER"
      path: "/opt/tuluat/tools"
      watch: true
  guardrails:
    piiMasking:
      enabled: true
      modes: ["SSN", "CREDIT_CARD", "PHONE"]
      replacementToken: "[REDACTED]"
    promptInjection:
      enabled: true
      strategy: "BLOCK"
    outputValidation:
      enabled: true
      minConfidence: 0.7
  a2a:
    enabled: false
  replicas: 1
---
apiVersion: ai.tuluat.com/v1alpha1
kind: AiAgent
metadata:
  name: risk-analysis-agent
  namespace: {{ .Values.namespace.name }}
spec:
  providerRef:
    name: "wiremock-provider"
    namespace: {{ .Values.namespace.name | quote }}
  model: "wiremock-gpt-4o"
  systemPrompt: |
    You are an automated Financial Risk & Fraud Detection Agent.
    Analyze the transaction and assign a riskLevel: LOW, HIGH, or CRITICAL.
  replicas: 1
---
apiVersion: ai.tuluat.com/v1alpha1
kind: AiAgent
metadata:
  name: balance-payment-agent
  namespace: {{ .Values.namespace.name }}
spec:
  providerRef:
    name: "wiremock-provider"
    namespace: {{ .Values.namespace.name | quote }}
  model: "wiremock-gpt-4o"
  systemPrompt: |
    You are an Account Balance & Payment Gateway Agent.
    Attempt payment and return paymentStatus: SUCCESS or INSUFFICIENT_FUNDS.
  replicas: 1
---
apiVersion: ai.tuluat.com/v1alpha1
kind: AiAgent
metadata:
  name: order-fulfillment-agent
  namespace: {{ .Values.namespace.name }}
spec:
  providerRef:
    name: "wiremock-provider"
    namespace: {{ .Values.namespace.name | quote }}
  model: "wiremock-gpt-4o"
  systemPrompt: |
    You are an Order Fulfillment & Invoice Generation Agent.
    Finalize the order and generate an invoice.
  replicas: 1
---
apiVersion: ai.tuluat.com/v1alpha1
kind: AiWorkflow
metadata:
  name: order-processing-workflow
  namespace: {{ .Values.namespace.name }}
spec:
  description: "Enterprise E-Commerce Order Processing Workflow (Risk Analysis -> Fraud Check Condition -> HITL Fraud Approval -> Balance Payment -> Order Fulfillment)"
  initialNode: risk-analysis-step
  nodes:
    - id: risk-analysis-step
      type: AGENT
      agentRef: risk-analysis-agent
      inputTemplate: "Analyze financial risk & fraud for order payload: {{`{{input}}`}}"
      outputKey: riskResult
    - id: risk-check-condition
      type: CONDITION
      expression: "#data['riskResult'] != null && (#data['riskResult'].contains('HIGH') || #data['riskResult'].contains('CRITICAL'))"
    - id: hitl-fraud-review
      type: HUMAN_APPROVAL
      inputTemplate: "Risk Officer Review Required! High Risk Detected: {{`{{riskResult}}`}}. Approve to proceed with payment, or Reject to cancel order."
      outputKey: fraudOfficerApproval
    - id: payment-execution-step
      type: AGENT
      agentRef: balance-payment-agent
      inputTemplate: "Execute balance check & charge payment for order: {{`{{input}}`}}. Risk status: {{`{{riskResult}}`}}"
      outputKey: paymentResult
    - id: payment-status-condition
      type: CONDITION
      expression: "#data['paymentResult'] != null && #data['paymentResult'].contains('SUCCESS')"
    - id: order-fulfillment-step
      type: AGENT
      agentRef: order-fulfillment-agent
      inputTemplate: "Finalize order & generate invoice for payment: {{`{{paymentResult}}`}}"
      outputKey: fulfillmentResult
  edges:
    - from: risk-analysis-step
      to: risk-check-condition
    - from: risk-check-condition
      to: hitl-fraud-review
      condition: "true"
    - from: risk-check-condition
      to: payment-execution-step
      condition: "false"
    - from: hitl-fraud-review
      to: payment-execution-step
      condition: "true"
    - from: payment-execution-step
      to: payment-status-condition
    - from: payment-status-condition
      to: order-fulfillment-step
      condition: "true"
  memoryConfig:
    shortMemorySize: 25
    enableLongMemory: true
    vectorTableName: order_vector_memory
{{- end }}
