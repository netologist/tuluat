apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: llmproviders.ai.tuluat.com
spec:
  group: ai.tuluat.com
  names:
    kind: LlmProvider
    listKind: LlmProviderList
    plural: llmproviders
    singular: llmprovider
    shortNames:
      - lp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                providerType:
                  type: string
                  description: "Provider type: OPENAI, ANTHROPIC, or OLLAMA. Use OPENAI for any OpenAI-compatible API (DeepSeek, Groq, Together AI, xAI, etc.)."
                baseUrl:
                  type: string
                  description: "Base API URL for the provider endpoint. For OpenAI-compatible providers, this is the root URL (e.g. https://api.deepseek.com)."
                apiKeySecretRef:
                  type: object
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                defaultModel:
                  type: string
                  description: "Default model name (e.g., gpt-4o, llama3.2)"
                temperature:
                  type: number
                maxTokens:
                  type: integer
                costPer1kInputTokens:
                  type: number
                  description: "USD per 1k input tokens (pricing metadata for Model Gateway)"
                costPer1kOutputTokens:
                  type: number
                  description: "USD per 1k output tokens (pricing metadata for Model Gateway)"
                fallbacks:
                  type: array
                  description: "Ordered fallback route list for the Model Gateway"
                  items:
                    type: object
                    properties:
                      providerName:
                        type: string
                      namespace:
                        type: string
                      model:
                        type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                observedGeneration:
                  type: integer
                lastUpdated:
                  type: string
