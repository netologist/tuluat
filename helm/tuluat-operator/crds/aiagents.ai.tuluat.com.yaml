apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aiagents.ai.tuluat.com
spec:
  group: ai.tuluat.com
  names:
    kind: AiAgent
    listKind: AiAgentList
    plural: aiagents
    singular: aiagent
    shortNames:
      - agent
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                providerRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                model:
                  type: string
                  description: "Model override for this agent"
                systemPrompt:
                  type: string
                  description: "System instructions for the AI model"
                userPrompt:
                  type: string
                  description: "Default user query / prompt template"
                skills:
                  type: array
                  description: "Agent Skills (SKILL.md instructions/guidelines based on agentskills.io spec)"
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                      enabled:
                        type: boolean
                      parameters:
                        type: object
                        additionalProperties:
                          type: string
                skillSources:
                  type: array
                  description: "Folder or ConfigMap paths containing SKILL.md / SKILLS.md files"
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: ["FOLDER", "CONFIGMAP"]
                      path:
                        type: string
                      watch:
                        type: boolean
                tools:
                  type: array
                  description: "Executable function-calling tools (calculator, web-search, custom JARs)"
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                      enabled:
                        type: boolean
                      parameters:
                        type: object
                        additionalProperties:
                          type: string
                toolSources:
                  type: array
                  description: "Executable tool plugin sources (JAR files or folders)"
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: ["FOLDER", "JAR", "CONFIGMAP"]
                      path:
                        type: string
                      watch:
                        type: boolean
                mcpServers:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                guardrails:
                  type: object
                  properties:
                    piiMasking:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        modes:
                          type: array
                          items:
                            type: string
                        replacementToken:
                          type: string
                    promptInjection:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        strategy:
                          type: string
                          enum: ["BLOCK", "SANITIZE"]
                    outputValidation:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        minConfidence:
                          type: number
                a2a:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    remoteDiscovery:
                      type: string
                ingress:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    host:
                      type: string
                    path:
                      type: string
                    pathType:
                      type: string
                    ingressClassName:
                      type: string
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                    tls:
                      type: object
                      properties:
                        secretName:
                          type: string
                        hosts:
                          type: array
                          items:
                            type: string
                replicas:
                  type: integer
            status:
              type: object
              properties:
                phase:
                  type: string
                ingressUrl:
                  type: string
                activeSkills:
                  type: array
                  items:
                    type: string
                activeTools:
                  type: array
                  items:
                    type: string
                effectiveModel:
                  type: string
                message:
                  type: string
                observedGeneration:
                  type: integer
                lastReconciledAt:
                  type: string
