apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcpservers.ai.tuluat.com
spec:
  group: ai.tuluat.com
  names:
    kind: McpServer
    listKind: McpServerList
    plural: mcpservers
    singular: mcpserver
    shortNames:
      - mcp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                endpoint:
                  type: string
                  description: "MCP server endpoint URL"
                transport:
                  type: string
                  enum: ["SSE", "STDIO", "HTTP"]
                  description: "MCP transport: SSE, STDIO, or HTTP"
                authType:
                  type: string
                  enum: ["NONE", "API_KEY", "OAUTH2"]
                  description: "Authentication type for the MCP server"
                apiKeySecretRef:
                  type: object
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                timeoutSeconds:
                  type: integer
                description:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                observedGeneration:
                  type: integer
                lastUpdated:
                  type: string
