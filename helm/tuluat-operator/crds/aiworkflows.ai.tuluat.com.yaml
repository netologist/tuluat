apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aiworkflows.ai.tuluat.com
spec:
  group: ai.tuluat.com
  names:
    kind: AiWorkflow
    listKind: AiWorkflowList
    plural: aiworkflows
    singular: aiworkflow
    shortNames:
      - workflow
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                description:
                  type: string
                initialNode:
                  type: string
                nodes:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      agentRef:
                        type: string
                      inputTemplate:
                        type: string
                      outputKey:
                        type: string
                      expression:
                        type: string
                      outputSchema:
                        type: string
                        description: "JSON Schema (as string) that this node's output must satisfy"
                edges:
                  type: array
                  items:
                    type: object
                    properties:
                      from:
                        type: string
                      to:
                        type: string
                      condition:
                        type: string
                memoryConfig:
                  type: object
                  properties:
                    shortMemorySize:
                      type: integer
                    enableLongMemory:
                      type: boolean
                    vectorTableName:
                      type: string
                budgetLimitUsd:
                  type: number
            status:
              type: object
              properties:
                state:
                  type: string
                nodeCount:
                  type: integer
                costSpentUsd:
                  type: string
                budgetLimitUsd:
                  type: string
                sessionCount:
                  type: integer
                totalTokens:
                  type: integer
                  format: int64
                inputTokens:
                  type: integer
                  format: int64
                outputTokens:
                  type: integer
                  format: int64
                agentNames:
                  type: array
                  items:
                    type: string
      additionalPrinterColumns:
        - name: state
          type: string
          description: Workflow state
          jsonPath: .status.state
        - name: costSpent
          type: string
          description: Total cost spent in USD
          jsonPath: .status.costSpentUsd
        - name: budget
          type: string
          description: Budget limit in USD
          jsonPath: .status.budgetLimitUsd
        - name: sessions
          type: integer
          description: Number of sessions
          jsonPath: .status.sessionCount
        - name: totalTokens
          type: integer
          description: Total tokens used
          jsonPath: .status.totalTokens
        - name: inputTokens
          type: integer
          description: Total input tokens
          jsonPath: .status.inputTokens
        - name: outputTokens
          type: integer
          description: Total output tokens
          jsonPath: .status.outputTokens
