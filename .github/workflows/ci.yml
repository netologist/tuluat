name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build & Test + Run KinD E2E'
        type: boolean
        default: true
      deploy_docs:
        description: 'Build & Deploy MkDocs Documentation'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # ── 1. Detect Changes ───────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.set-output.outputs.has_changes }}
      docs_changed: ${{ steps.set-output.outputs.docs_changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'pom.xml'
              - '**/pom.xml'
              - 'src/**'
              - '**/src/**'
              - 'Dockerfile*'
              - 'manifests/**'
              - 'config/**'
              - 'scripts/**'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'

      - name: Compute Build Outputs
        id: set-output
        run: |
          EVENT_NAME="${{ github.event_name }}"
          FORCE_BUILD="${{ inputs.build_all }}"
          FORCE_DOCS="${{ inputs.deploy_docs }}"
          CODE_FILTER="${{ steps.filter.outputs.code }}"
          DOCS_FILTER="${{ steps.filter.outputs.docs }}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "has_changes=${FORCE_BUILD:-true}" >> $GITHUB_OUTPUT
            echo "docs_changed=${FORCE_DOCS:-true}" >> $GITHUB_OUTPUT
          else
            echo "has_changes=${CODE_FILTER}" >> $GITHUB_OUTPUT
            echo "docs_changed=${DOCS_FILTER}" >> $GITHUB_OUTPUT
          fi

  # ── 2. Build (Spotless Check, Unit Tests & Container Image) ─────────────────
  build:
    name: Build Operator
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.has_changes == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Spotless Code Format Check
        run: |
          ./mvnw spotless:check

      - name: Run Checkstyle Static Code Analysis
        run: |
          ./mvnw checkstyle:check

      - name: Run ArchUnit Architecture Tests
        run: |
          ./mvnw test -pl tuluat-app -am -Dtest=ArchitectureTest -Dsurefire.failIfNoSpecifiedTests=false -Denable-preview
      - name: Run Project Unit Tests
        run: |
          ./mvnw test -Denable-preview
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image with GHA Layer Cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tuluat-operator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Container Image Artifact
        run: |
          mkdir -p image-dist
          docker save tuluat-operator:latest | gzip > image-dist/tuluat-operator-image.tar.gz

      - name: Upload Container Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuluat-operator-container-image
          path: image-dist/*.tar.gz
          if-no-files-found: error

  # ── 3. Lint & Package Helm Chart ──────────────────────────────────────────
  package-helm:
    name: Lint & Package Helm Chart
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint Helm Chart
        run: |
          helm lint helm/tuluat-operator

      - name: Package Helm Chart
        run: |
          mkdir -p dist
          helm package helm/tuluat-operator -d dist

      - name: Upload Helm Chart Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuluat-operator-helm-chart
          path: dist/*.tgz
          if-no-files-found: error

  # ── 4. Push Helm Chart OCI Artifact to GHCR ─────────────────────────────
  publish-helm:
    name: Deploy Helm Chart OCI Artifact to GHCR
    needs: [detect-changes, build, package-helm]
    if: needs.detect-changes.outputs.has_changes == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Download Helm Chart Artifact
        uses: actions/download-artifact@v4
        with:
          name: tuluat-operator-helm-chart
          path: dist

      - name: Push Helm Chart OCI Artifact to GHCR
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        env:
          HELM_EXPERIMENTAL_OCI: "1"
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push dist/*.tgz "oci://ghcr.io/${OWNER_LOWER}/charts"

  # ── 5. KinD Cluster & E2E Acceptance Tests ─────────────────────────────────
  e2e-kind:
    name: KinD Cluster E2E Acceptance Test
    needs: [publish-helm, build]
    if: "needs.publish-helm.result == 'success' && needs.build.result == 'success'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Create KinD Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: tuluat-cluster
          wait: 120s

      - name: Create tuluat-system Namespace
        run: kubectl create namespace tuluat-system --dry-run=client -o yaml | kubectl apply -f -

      - name: Download Container Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: tuluat-operator-container-image
          path: image-dist

      - name: Load Pre-Built Container Image into KinD
        run: |
          docker load -i image-dist/tuluat-operator-image.tar.gz
          kind load docker-image tuluat-operator:latest --name tuluat-cluster

      - name: Download Helm Chart Artifact
        uses: actions/download-artifact@v4
        with:
          name: tuluat-operator-helm-chart
          path: dist

      - name: Deploy Everything via Packaged Helm Chart
        run: |
          helm upgrade --install tuluat-operator dist/*.tgz \
            --namespace tuluat-system \
            --set namespace.create=false \
            --set operator.image.repository=tuluat-operator \
            --set operator.image.tag=latest \
            --set operator.image.pullPolicy=IfNotPresent \
            --set wiremock.enabled=true \
            --set samples.install=true \
            --wait --timeout=5m

      - name: Wait for Operator Pod Readiness
        run: |
          kubectl rollout status deployment/tuluat-operator -n tuluat-system --timeout=120s

      - name: Run E2E Smoke & Acceptance Test Suite
        run: |
          PORT=8089
          kubectl port-forward svc/tuluat-operator-service "${PORT}:8080" -n tuluat-system &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          sleep 5

          ./scripts/e2e-acceptance-test.sh "http://localhost:${PORT}" "tuluat-system"

      - name: Debug Pods on Failure
        if: failure()
        run: |
          kubectl get pods,svc,crd -n tuluat-system -o wide
          kubectl logs deployment/tuluat-operator -n tuluat-system --tail=150 || true
          kubectl logs deployment/temporal-server -n tuluat-system --tail=100 || true
          kubectl logs deployment/postgres-pgvector -n tuluat-system --tail=50 || true

  # ── 6. MkDocs Build & GitHub Pages Deploy ─────────────────────────────────
  build-docs:
    name: Build & Deploy MkDocs Documentation
    needs: detect-changes
    if: needs.detect-changes.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages-${{ github.ref }}"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs & Material Theme
        run: |
          pip install mkdocs mkdocs-material pymdown-extensions

      - name: Build MkDocs Site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          mkdocs build --strict

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v4
